spring.application.name=smart-watchlist
spring.datasource.url=jdbc:postgresql://localhost:5432/watchlist_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# We already own the schema (schema.sql) and have real data loaded —
# so Hibernate should VALIDATE entities match, never auto-alter tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true